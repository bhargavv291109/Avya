<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVYA Admin — Reviews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f4f4f4;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.logo{font-size:28px;font-weight:900;letter-spacing:-1px}.muted{color:#9b9b9b}.grid{display:grid;gap:16px}
.card{background:#111;border:1px solid #292929;border-radius:18px;padding:20px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.approve{background:#d9ff3f;color:#090909}.reject{background:#292929;color:#fff}.danger{background:#5b1717;color:#fff}.feature{background:#292929;color:#fff}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#0b0b0b;color:#fff;margin:8px 0 14px}
.login{max-width:430px;margin:10vh auto}.hidden{display:none}.review{display:grid;gap:12px}.stars{letter-spacing:2px}.tag{font-size:12px;border:1px solid #333;border-radius:999px;padding:5px 9px;color:#bdbdbd}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login card">
    <h1>AVYA Admin</h1>
    <p class="muted">Review management</p>
    <input id="password" type="password" placeholder="Admin password">
    <button class="approve" onclick="login()">Login</button>
    <p id="loginStatus" class="muted"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="top">
      <div><div class="logo">AVYA</div><div class="muted">Reviews dashboard</div></div>
      <button class="reject" onclick="logout()">Logout</button>
    </div>
    <div id="reviews" class="grid"></div>
  </div>
</div>
<script>
async function login(){
  const password=document.getElementById("password").value;
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
  const d=await r.json();
  if(r.ok){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");load();}
  else document.getElementById("loginStatus").textContent=d.error||"Login failed";
}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload();}
function stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
async function load(){
  const r=await fetch("/api/admin/reviews");
  if(r.status===401){location.reload();return}
  const data=await r.json();
  const box=document.getElementById("reviews");
  if(!data.length){box.innerHTML='<div class="card"><h3>No reviews yet.</h3><p class="muted">New customer submissions will appear here.</p></div>';return}
  box.innerHTML=data.map(x=>`
    <article class="card review">
      <div class="row"><strong>${esc(x.name)}</strong><span class="tag">${esc(x.service)}</span><span class="tag">${x.approved?'Approved':'Pending'}</span>${x.featured?'<span class="tag">Featured</span>':''}</div>
      <div class="stars">${stars(x.rating)}</div>
      <div>${esc(x.review)}</div>
      <div class="muted">${new Date(x.created_at).toLocaleString()}</div>
      <div class="row">
        ${!x.approved?`<button class="approve" onclick="action(${x.id},'approve')">Approve</button>`:''}
        ${x.approved?`<button class="feature" onclick="action(${x.id},'feature')">${x.featured?'Unfeature':'Feature'}</button>`:''}
        ${!x.approved?`<button class="reject" onclick="action(${x.id},'reject')">Reject</button>`:''}
        <button class="danger" onclick="action(${x.id},'delete')">Delete</button>
      </div>
    </article>`).join("");
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function action(id,type){
  const url=type==='delete'?`/api/admin/reviews/${id}`:`/api/admin/reviews/${id}/${type}`;
  const method=type==='delete'?'DELETE':'PATCH';
  const r=await fetch(url,{method});
  if(r.ok)load(); else alert("Action failed");
}
</script>
</body>
</html>
